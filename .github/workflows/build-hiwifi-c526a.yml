name: Build ImmortalWrt for HiWiFi C526A
 
on:
workflow_dispatch:
push:
branches:
- main
paths:
- 'patches/**'
- 'configs/**'
- '.github/workflows/**'
 
env:
REPO_URL: https://github.com/immortalwrt/immortalwrt.git
REPO_REF: v25.12.2
DEVICE: hiwifi_c526a
 
jobs:
build:
runs-on: ubuntu-22.04
 
steps:
- name: Checkout this repository
uses: actions/checkout@v4
 
- name: Free disk space
uses: jlumbroso/free-disk-space@main
with:
tool-cache: true
android: true
dotnet: true
haskell: true
large-packages: true
docker-images: false
swap-storage: true
 
- name: Install build dependencies
run: |
sudo apt-get update
sudo apt-get install -y build-essential clang flex bison g++ gawk \
gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
python3-distutils rsync unzip zlib1g-dev file wget
 
- name: Clone ImmortalWrt ${{ env.REPO_REF }}
run: git clone --depth 1 --branch "${REPO_REF}" "${REPO_URL}" openwrt
 
- name: Apply HiWiFi C526A device support patch
run: |
cd openwrt
git apply --check ../patches/0001-ipq40xx-add-hiwifi-c526a-support.patch
git apply ../patches/0001-ipq40xx-add-hiwifi-c526a-support.patch
 
- name: Update and install feeds
run: |
cd openwrt
./scripts/feeds update -a
./scripts/feeds install -a
 
- name: Configure (select hiwifi_c526a)
run: |
cd openwrt
cp ../configs/ipq40xx_hiwifi_c526a.config .config
make defconfig
grep -q '^CONFIG_TARGET_ipq40xx_generic_DEVICE_hiwifi_c526a=y$' .config
grep -q '^CONFIG_TARGET_ipq40xx=y$' .config
 
- name: Download source archives
run: cd openwrt && make -j"$(nproc)" download V=s
 
- name: Build firmware
run: cd openwrt && make -j"$(nproc)" V=s
 
- name: Collect images
run: |
mkdir -p output
find openwrt/bin/targets/ipq40xx/generic -maxdepth 1 -type f \
-name "*${DEVICE}*" -exec cp -v {} output/ \;
cp openwrt/bin/targets/ipq40xx/generic/sha256sums output/ 2>/dev/null || true
ls -l output/
 
- name: Upload firmware artifacts
uses: actions/upload-artifact@v4
with:
name: immortalwrt-${{ env.REPO_REF }}-${{ env.DEVICE }}
path: output/*
if-no-files-found: error
